name: Docker Hub mirror
description: Makes the runner's own Docker daemon read Docker Hub images through Google's public mirror, mirror.gcr.io, so pinned pulls do not use Docker Hub's anonymous rate limit. Digests are still verified, and Docker reads Docker Hub itself when the mirror lacks an image or fails.
runs:
  using: composite
  steps:
    - name: Read Docker Hub through mirror.gcr.io
      shell: bash
      run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash "$GITHUB_ACTION_PATH/mirror.sh"
