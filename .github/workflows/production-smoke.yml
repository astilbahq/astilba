name: Public web production smoke (disabled pending handover)

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'astilbahq/astilba' && github.ref == 'refs/heads/main' && vars.WEB_SMOKES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Smoke-test apex
        run: node apps/site/scripts/smoke-production.mjs
      - name: Smoke-test Docs
        if: ${{ !cancelled() }}
        run: node apps/docs/scripts/smoke-production.mjs
