name: Cache verification
defaults:
  run:
    working-directory: packages/cache
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect Cache changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          persist-credentials: false
      # Pushes, releases (workflow_call) and dispatches always run every lane. A pull request runs
      # them only when it touches Cache, its harness, demo or fixture, a root file such as the
      # lockfile, or this workflow.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          relevant=true
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the pull request's merge commit; its first parent is the base branch.
            # --no-renames lists both sides of a move; -z keeps unusual paths unquoted.
            changed=$(git diff --name-only --no-renames -z HEAD^1 HEAD | tr '\0' '\n')
            if ! grep -qE '^([^/]+|packages/cache/.*|packages/cache-harness/.*|apps/cache-demo/.*|fixtures/cache-react-router/.*|\.github/workflows/cache\.yml)$' <<<"$changed"; then
              relevant=false
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
  check:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: grep-guard (no ambient time/randomness in the kernel; PLATFORM-noted in adapters)
        run: |
          if git grep -nE 'Date\.now\(|Math\.random\(|setTimeout\(|setInterval\(|performance\.now\(' -- src ':(exclude)src/adapters'; then
            echo "::error::ambient time/randomness found in kernel (non-adapter) src"
            exit 1
          fi
          fail=0
          for f in $(git ls-files 'src/adapters/**/*.ts'); do
            awk '
              /PLATFORM:/ { last=NR }
              /Date\.now\(|Math\.random\(|setTimeout\(|setInterval\(|performance\.now\(/ {
                if (last == 0 || NR - last > 3) { printf "%s:%d: ambient platform call without a nearby // PLATFORM: note\n", FILENAME, NR; bad=1 }
              }
              END { exit bad }
            ' "$f" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::an adapter ambient-time use lacks a // PLATFORM: justification (ground rule 5)"
            exit 1
          fi
      - name: grep-guard (no quoted design prose in tracked comments)
        run: |
          fail=0
          if git grep -niE '^[[:space:]]*(//|\*).*(the errata|errata.?s|the spec|the design).*"' -- . ../cache-harness ../../apps/cache-demo ../../fixtures/cache-react-router ':(top,exclude)*.json'; then
            echo "::error::a comment attributes to the design docs next to a quote — paraphrase it (numbers-only cites only)"
            fail=1
          fi
          if git grep -nE '^[[:space:]]*(//|\*)[^"]*"[^"]*$' -- . ../cache-harness ../../apps/cache-demo ../../fixtures/cache-react-router ':(top,exclude)*.json' | grep -vE '"[^"]*"'; then
            echo "::error::a comment opens a multi-line quoted span — likely copied design prose"
            fail=1
          fi
          exit "$fail"
      - name: binary tripwire (no NUL byte in any tracked file)
        run: node scripts/assert-no-nul-bytes.mjs
      - name: resolved Vitest cohort (direct and Vite+ share one instance)
        run: pnpm verify:toolchain
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc -p test/integration/tsconfig.json --noEmit
      - run: vp test run --project unit --project harness --coverage
      - run: pnpm lint:publish
  invariants:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: invariants (sacred suite)
        run: pnpm vitest run --project invariants --reporter=verbose --reporter=json --outputFile.json=invariants-report.json
      - name: append pass/fail count to the job summary
        if: always()
        run: node scripts/invariant-summary.mjs invariants-report.json >> "$GITHUB_STEP_SUMMARY"
  sacred-unwritable-by-tools:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: prove the lint autofixer runs, then require it left sacred untouched
        run: |
          probe=test/unit/__autofix_liveness_probe.test.ts
          trap 'rm -f "$probe"' EXIT
          printf 'import { expect, it } from "vitest";\nit("autofix liveness probe", () => {\n  expect(1).toStrictEqual(1);\n});\n' > "$probe"
          pnpm fix || true
          if ! grep -q 'toBe(1)' "$probe"; then
            echo "::error::the lint autofixer did not rewrite the seeded probe (toStrictEqual→toBe) — the assertion-rewriting pass did not run, so the sacred check below would pass vacuously. Fix the fixer invocation before trusting this gate."
            exit 1
          fi
          if ! git diff --exit-code -- test/invariants test/scenarios; then
            echo "::error::an autofix rewrote a sacred test. Sacred is append-only for tools too: a fixer's diff here is an unauthorized amendment. Repeal the offending rule if it contradicts signed law, or fence it — never accept the rewrite."
            exit 1
          fi
          echo "lint autofixer proven live; sacred lane untouched"
  conformance:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: conformance (driver contracts)
        run: pnpm vitest run --project conformance
  integration:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: integration (workerd durable-object lane, verified 2-CPU shape)
        run: |
          set -euo pipefail
          command -v taskset >/dev/null 2>&1 || {
            echo "::error::taskset absent — the 2-vCPU budget cannot be enforced on this host"; exit 1; }
          [ "$(nproc)" -ge 2 ] || {
            echo "::error::host reports $(nproc) CPU(s); the 2-vCPU budget shape does not apply"; exit 1; }
          allowed="$(awk '/^Cpus_allowed_list:/{print $2}' /proc/self/status)"
          cpus="$(printf '%s\n' "$allowed" | tr ',' '\n' | while read -r r; do
                    [ -n "$r" ] || continue
                    case "$r" in *-*) seq "${r%-*}" "${r#*-}" ;; *) printf '%s\n' "$r" ;; esac
                  done | head -2 | paste -sd, -)"
          [ "$(printf '%s\n' "$cpus" | tr ',' '\n' | grep -c .)" = "2" ] || {
            echo "::error::could not select 2 CPUs from the allowed set '$allowed'"; exit 1; }
          budget="$(taskset -c "$cpus" nproc)"
          [ "$budget" = "2" ] || {
            echo "::error::CPU budget NOT in effect (taskset -c $cpus nproc reported $budget, expected 2)"; exit 1; }
          echo "CPU budget verified in effect: CPUs [$cpus] of allowed set [$allowed] ($(nproc) visible)"
          taskset -c "$cpus" pnpm vitest run --project integration --disable-console-intercept
  worker-types-drift:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: worker-configuration.d.ts drift guard
        run: |
          pnpm run types:integration
          git diff --exit-code -- test/integration/worker-configuration.d.ts
  bun:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun test test/bun-smoke
  knip:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm knip
      - run: pnpm knip:production
  build-smoke:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: build-smoke (react-router build under real Vite 8)
        run: pnpm -C ../../fixtures/cache-react-router run build
  boot-smoke:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm -C ../../fixtures/cache-react-router run build
      - name: boot-smoke (workerd boots the fixture and serves one request)
        run: node scripts/boot-smoke.mjs
  module-scope-boot:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: module-scope-boot (a module-scope factory boots on workerd and survives a request boundary)
        run: node scripts/module-scope-boot.mjs
  demo:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: typed routes are generated and load-bearing (dirty-tree check)
        run: node scripts/demo-typed-routes.mjs
      - name: demo machinery (wrappers · scenes · narration)
        run: pnpm vitest run --project demo
      - name: demo build (react-router build under real Vite 8, real bindings)
        run: pnpm -C ../../apps/cache-demo run build
      - name: worker-configuration.d.ts drift guard
        run: |
          (cd ../../apps/cache-demo && pnpm exec wrangler types)
          git diff --exit-code -- ../../apps/cache-demo/worker-configuration.d.ts
  demo-boot-witness:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "24"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm -C ../../apps/cache-demo run build
      - name: demo-boot-witness (the composed demo establishes its bus channel on workerd)
        run: node scripts/demo-boot-witness.mjs
  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - changes
      - check
      - invariants
      - sacred-unwritable-by-tools
      - conformance
      - integration
      - worker-types-drift
      - bun
      - knip
      - build-smoke
      - boot-smoke
      - module-scope-boot
      - demo
      - demo-boot-witness
    runs-on: ubuntu-24.04
    steps:
      - name: require every CI lane to pass
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e '.changes.result == "success"' <<<"$RESULTS" >/dev/null; then
            echo "::error::changes finished with $(jq -r '.changes.result' <<<"$RESULTS")"
            exit 1
          fi
          if jq -e '.changes.outputs.relevant != "true"' <<<"$RESULTS" >/dev/null; then
            echo "::notice::no Cache-relevant changes; the lanes were skipped"
            exit 0
          fi
          echo "::notice::integration finished with $(jq -r '.integration.result // "absent"' <<<"$RESULTS") — adjudicate per ground rule 14"
          if ! jq -e 'del(.changes, .integration) | all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null; then
            jq -r 'del(.changes, .integration) | to_entries[] | select(.value.result != "success") | "\(.key) finished with \(.value.result)"' <<<"$RESULTS" |
              while IFS= read -r failure; do
                echo "::error::$failure"
              done
            exit 1
          fi
