name: Native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - run: node --test scripts/ci-native-plan.test.mjs
      - name: Select checks from the tested merge
        id: plan
        run: node scripts/ci-native-plan.mjs

  host:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    name: Host (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select native Go cache
        run: |
          printf 'GOCACHE=%s/astilba-native-go/build\nGOMODCACHE=%s/astilba-native-go/mod\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Cache native Go compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/astilba-native-go
          key: native-go-v2-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.github/workflows/ci.yml', 'experiments/durable-execution/host/bootstrap.sh', '**/go.mod') }}-${{ hashFiles('**/go.sum', 'experiments/durable-execution/**/*.go', 'services/platform/**/*.go') }}
          restore-keys: native-go-v2-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.github/workflows/ci.yml', 'experiments/durable-execution/host/bootstrap.sh', '**/go.mod') }}-
      - name: Verify fresh production host bootstrap
        run: |
          owner=$(cat /proc/sys/kernel/random/uuid)
          sudo env ASTILBA_DISPOSABLE_HOST=1 ASTILBA_BOOTSTRAP_OWNER="$owner" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_RUN_ID="$GITHUB_RUN_ID" bash services/platform/host/prepare-bootstrap-test.sh
          cd services/platform
          sudo --preserve-env=GOCACHE,GOMODCACHE env PATH="$PATH" ASTILBA_NATIVE_BOOTSTRAP=1 ASTILBA_BOOTSTRAP_OWNER="$owner" go test -count=1 -timeout=12m -v -run '^TestBootstrapOnDisposableHost$' ./host
      - name: Install pinned disposable host runtime
        run: |
          sudo env PLAT4_DISPOSABLE_HOST=1 bash experiments/durable-execution/host/bootstrap.sh
          sudo env PLAT4_DISPOSABLE_HOST=1 bash experiments/durable-execution/host/build-tools.sh
          sudo env ASTILBA_DISPOSABLE_HOST=1 bash services/platform/host/backup-tools.sh
          sudo env ASTILBA_DISPOSABLE_HOST=1 bash services/platform/host/network-test-tools.sh
      - name: Pull pinned fixture images
        run: |
          sudo /opt/astilba-plat4/bin/docker --host unix:///run/astilba-plat4/docker.sock pull postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
          sudo /opt/astilba-plat4/bin/docker --host unix:///run/astilba-plat4/docker.sock pull postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
          sudo /opt/astilba-plat4/bin/docker --host unix:///run/astilba-plat4/docker.sock pull busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          sudo /opt/astilba-plat4/bin/docker --host unix:///run/astilba-plat4/docker.sock pull traefik:v3.7.16@sha256:22a759fb803abb5c3a7ba5d5a55a201c5fb0fc8993d5c72c47a89075e64f1953
          sudo /opt/astilba-plat4/bin/docker --host unix:///run/astilba-plat4/docker.sock pull moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          sudo /opt/astilba-plat4/bin/docker --host unix:///run/astilba-plat4/docker.sock pull dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
      - name: Verify native Ubuntu host
        working-directory: experiments/durable-execution
        run: make -C ../.. verify-host PLAT4_ARCH=${{ matrix.arch }}
      - name: Verify builds and PostgreSQL restore
        run: make verify-build PLAT4_ARCH=${{ matrix.arch }}
      - name: Verify production agent with systemd
        run: make verify-agent-host

  verify:
    name: Native verification
    if: always()
    needs: [plan, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require selected native architectures
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NATIVE: ${{ needs.plan.outputs.native }}
          HOST_RESULT: ${{ needs.host.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$NATIVE:$HOST_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
