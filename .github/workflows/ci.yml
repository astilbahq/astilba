name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24.18.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm verify:ui:base

  ui-browser:
    name: UI browser contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/ui-showcase test:browser:install:ci
      - run: pnpm build:ui && pnpm --dir apps/ui-showcase test:browser
      - run: pnpm --dir apps/ui-showcase deploy:dry-run
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-browser-diagnostics
          path: |
            apps/ui-showcase/playwright-report/
            apps/ui-showcase/test-results/
          retention-days: 7

  web:
    name: Docs and apex verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/docs test:browser:install:ci
      - run: pnpm verify:web
        env:
          WRANGLER_LOG_PATH: ${{ github.workspace }}/ci-wrangler-logs
          WRANGLER_LOG_SANITIZE: "true"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-browser-diagnostics
          path: |
            apps/docs/playwright-report/
            apps/docs/test-results/
            apps/site/playwright-report/
            apps/site/test-results/
            ci-wrangler-logs/
          retention-days: 7

  registry:
    name: Registry examples on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: fixtures/registry/env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: fixtures/registry/env/package.json
      - run: pnpm install --frozen-lockfile
      - if: runner.os != 'Windows'
        run: pnpm verify:all
      - if: runner.os == 'Windows'
        run: pnpm verify:windows

  result:
    name: CI result
    if: always()
    needs: [ui, ui-browser, web, registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
