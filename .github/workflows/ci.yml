name: Native

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # Only pull requests and merge groups share a group. A shared group keeps one waiting
  # run and cancels the others, even without cancel-in-progress, so main pushes, manual
  # and scheduled runs each get their own.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.ref || github.run_id }}
  # A newer commit replaces a pull request's run. A cancelled merge group would eject its
  # pull requests from the queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merge group's base can be further back than its first parent.
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - name: Select checks from the tested merge
        id: plan
        # Pull requests and merge groups run their base's planner, so editing the planner
        # cannot select its own checks. A key the base planner does not know selects the suite.
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group) base=$MERGE_GROUP_BASE_SHA ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base:scripts/ci-plan.mjs" 2>/dev/null; then
            git show "$base:scripts/ci-plan.mjs" > "$RUNNER_TEMP/ci-plan.mjs"
            node "$RUNNER_TEMP/ci-plan.mjs"
          fi
          grep -q '^native=' "$GITHUB_OUTPUT" || echo "native=true" >> "$GITHUB_OUTPUT"

  host:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    name: Host (${{ matrix.platform.arch }}, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        # Every lane prepares its own disposable VM identically; none shares host state.
        lane: [core, recovery, visual, upgrade]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select native Go cache
        run: |
          printf 'GOCACHE=%s/astilba-native-go/build\nGOMODCACHE=%s/astilba-native-go/mod\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Cache native Go compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/astilba-native-go
          key: native-go-v2-${{ runner.os }}-${{ matrix.platform.arch }}-${{ matrix.lane }}-${{ hashFiles('.github/workflows/ci.yml', 'experiments/durable-execution/host/bootstrap.sh', '**/go.mod') }}-${{ hashFiles('**/go.sum', 'experiments/durable-execution/**/*.go', 'services/platform/**/*.go') }}
          restore-keys: native-go-v2-${{ runner.os }}-${{ matrix.platform.arch }}-${{ matrix.lane }}-${{ hashFiles('.github/workflows/ci.yml', 'experiments/durable-execution/host/bootstrap.sh', '**/go.mod') }}-
      - name: Download native Go modules
        # Loading every package fetches the toolchain and the modules they import, keeping tool-only
        # modules out of the cache. A package load error also fails here, after the same attempts.
        run: |
          for delay in 0 20 40; do
            sleep "$delay"
            if timeout 5m go -C services/platform list -deps -test ./... >/dev/null &&
              timeout 5m go -C experiments/durable-execution list -deps -test ./... >/dev/null; then
              exit 0
            fi
            echo "::warning::Loading native Go packages failed; see the error above"
          done
          exit 1
      - name: Choose a current Ubuntu archive
        # Canonical first, then independent mirrors. Every one is verified against Ubuntu's key.
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash scripts/ci-ubuntu-archive.sh
      - name: Verify fresh production host bootstrap
        env:
          # Two lanes per architecture block this host's Ubuntu archives, so the bootstrap must
          # install from a pinned fallback; the others install from the host's own sources.
          BLOCK_UBUNTU_ARCHIVES: ${{ (matrix.lane == 'core' || matrix.lane == 'visual') && '1' || '0' }}
        run: |
          owner=$(cat /proc/sys/kernel/random/uuid)
          sudo env ASTILBA_DISPOSABLE_HOST=1 ASTILBA_BOOTSTRAP_OWNER="$owner" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_RUN_ID="$GITHUB_RUN_ID" bash services/platform/host/prepare-bootstrap-test.sh
          cd services/platform
          sudo --preserve-env=GOCACHE,GOMODCACHE env PATH="$PATH" ASTILBA_NATIVE_BOOTSTRAP=1 ASTILBA_BOOTSTRAP_OWNER="$owner" ASTILBA_BOOTSTRAP_BLOCK_UBUNTU_ARCHIVES="$BLOCK_UBUNTU_ARCHIVES" go test -count=1 -timeout=12m -v -run '^TestBootstrapOnDisposableHost$' ./host
      - name: Install pinned disposable host runtime
        run: |
          sudo env PLAT4_DISPOSABLE_HOST=1 bash experiments/durable-execution/host/bootstrap.sh
          sudo env PLAT4_DISPOSABLE_HOST=1 bash experiments/durable-execution/host/build-tools.sh
          sudo env ASTILBA_DISPOSABLE_HOST=1 bash services/platform/host/backup-tools.sh
          sudo env ASTILBA_DISPOSABLE_HOST=1 bash services/platform/host/network-test-tools.sh
      - name: Pull pinned fixture images
        uses: ./.github/actions/pull-images
        with:
          docker: sudo /opt/astilba-plat4/bin/docker --host unix:///run/astilba-plat4/docker.sock
          images: |
            postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
            postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
            busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
            traefik:v3.7.16@sha256:22a759fb803abb5c3a7ba5d5a55a201c5fb0fc8993d5c72c47a89075e64f1953
            nginx:1.30.6-alpine3.24@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
            caddy:2.11.8-alpine@sha256:3db3a09e418f86a8fce8de4bc0026fccd2b4cd925aef00cc7d843d9fdc75e442
            moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
            dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
      - name: Verify native Ubuntu host
        if: matrix.lane == 'core'
        working-directory: experiments/durable-execution
        run: make -C ../.. verify-host PLAT4_ARCH=${{ matrix.platform.arch }}
      - name: Verify builds and PostgreSQL restore
        if: matrix.lane == 'core'
        run: make verify-build PLAT4_ARCH=${{ matrix.platform.arch }}
      - name: Verify production agent with systemd
        run: make verify-agent-host-${{ matrix.lane }}

  verify:
    name: Native verification
    if: always()
    needs: [plan, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require selected native architectures
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NATIVE: ${{ needs.plan.outputs.native }}
          HOST_RESULT: ${{ needs.host.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$NATIVE:$HOST_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
