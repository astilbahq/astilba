name: Application browsers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-browsers:
    name: Dashboard (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/platform/go.mod
          cache-dependency-path: services/platform/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Start preinstalled browsers
        id: browsers
        run: |
          container=$(docker run --detach --interactive --init --shm-size=1g \
            --publish 127.0.0.1:54190:54190 \
            --label "com.astilba.ci-browsers=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$(command -v node):/opt/ci-node:ro" \
            --entrypoint /opt/ci-node \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea \
            /workspace/apps/platform/node_modules/@playwright/test/cli.js run-server --host 0.0.0.0 --port 54190)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 3 --retry-max-time 30 http://127.0.0.1:54190/json
      - run: pnpm --filter @astilba/dashboard test:browser --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        env:
          PLAT_APP_DOCKER_HOST: unix:///var/run/docker.sock
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:54190/
          PW_TEST_CONNECT_EXPOSE_NETWORK: "<loopback>"
          WRANGLER_SEND_METRICS: "false"
      - name: Retain application failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-${{ matrix.browser }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            .artifacts/p1/playwright/**/trace.zip
            .artifacts/p1/playwright/**/error-context.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop browser server
        if: ${{ always() && steps.browsers.outputs.container != '' }}
        env:
          BROWSER_CONTAINER: ${{ steps.browsers.outputs.container }}
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels "com.astilba.ci-browsers" }}' "$BROWSER_CONTAINER")" = "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker logs "$BROWSER_CONTAINER"
          docker rm --force "$BROWSER_CONTAINER"

  verify:
    name: Application browser verification
    if: always()
    needs: [application-browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every browser shard
        env:
          SHARDS_RESULT: ${{ needs.application-browsers.result }}
        run: test "$SHARDS_RESULT" = success
