name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-web
      url: https://astilba.com/
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @astilba/tokens build && pnpm --filter @astilba/ui build

      - name: Deploy apex
        run: pnpm --dir apps/site deploy
      - run: pnpm --dir apps/site smoke:production
        env:
          ASTILBA_SITE_SMOKE_ATTEMPTS: "10"
          ASTILBA_SITE_SMOKE_RETRY_DELAY_MS: "6000"

      - name: Deploy docs
        run: pnpm --dir apps/docs deploy
      - run: pnpm --dir apps/docs smoke:production
        env:
          ASTILBA_DOCS_SMOKE_ATTEMPTS: "10"
          ASTILBA_DOCS_SMOKE_RETRY_DELAY_MS: "6000"

      - name: Deploy UI showcase
        run: pnpm --filter @astilba/showcase build && pnpm exec wrangler deploy
      - run: pnpm smoke:production
