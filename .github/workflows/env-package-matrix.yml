name: Env package matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/env

jobs:
  changes:
    name: Detect Env changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Pushes, releases (workflow_call) and dispatches always run the matrix. A pull request runs
      # it only when it touches Env, the registry fixture its consumer jobs use, a root file such
      # as the lockfile, or this workflow.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          relevant=true
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the pull request's merge commit; its first parent is the base branch.
            # --no-renames lists both sides of a move; -z keeps unusual paths unquoted.
            changed=$(git diff --name-only --no-renames -z HEAD^1 HEAD | tr '\0' '\n')
            if ! grep -qE '^([^/]+|packages/env/.*|fixtures/registry/.*|\.github/workflows/env-package-matrix\.yml)$' <<<"$changed"; then
              relevant=false
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  pack:
    name: Pack exact archive
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm install --frozen-lockfile
        working-directory: fixtures/registry/env
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm verify
      - run: pnpm pack:artifact
      - run: pnpm verify:artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  consumers:
    name: Clean ${{ matrix.manager }} consumer
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
          package_json_file: fixtures/registry/env/package.json
      - run: node scripts/verify-consumer.mjs ${{ matrix.manager }}

  cloudflare-workers:
    name: Cloudflare Workers archive admission
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
      - run: node scripts/verify-workers-consumer.mjs

  node-typescript:
    name: Node ${{ matrix.node }} / TypeScript ${{ matrix.typescript }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [22.14.0, 22.23.2, 24.18.1, 26.5.1]
        typescript: [6.0.3, 7.0.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
      - run: node scripts/verify-node-consumer.mjs ${{ matrix.node }} ${{ matrix.typescript }}

  portable:
    name: Bun and workerd portable equivalence
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node scripts/verify-consumer.mjs bun
      - run: node scripts/verify-portable-equivalence.mjs

  generation-and-vite:
    name: Deterministic generation and Vite
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node scripts/verify-deterministic-generation.mjs
      - run: node scripts/verify-vite-consumer.mjs

  next:
    name: Next ${{ matrix.next }} / ${{ matrix.mode }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        next: [15.5.22, 16.2.12]
        mode: [app-static, app-request, pages-static, pages-request]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node scripts/verify-next-consumer.mjs ${{ matrix.next }} ${{ matrix.mode }}

  windows-consumer:
    # The verifier imports only Node built-ins; root development needs Node 22.22.2.
    # Keep archive admission independent at the published Node 22.14 minimum.
    name: Windows archive consumer
    needs: pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/local
      - run: node scripts/verify-consumer.mjs npm

  result:
    name: Env matrix result
    if: always()
    needs:
      [
        changes,
        pack,
        consumers,
        cloudflare-workers,
        node-typescript,
        portable,
        generation-and-vite,
        next,
        windows-consumer,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        # No checkout here, so packages/env (the workflow default) does not exist.
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        # Passes when the pull request touched nothing Env depends on and the matrix was skipped.
        run: |
          jq -e 'if .changes.result != "success" then false
            elif .changes.outputs.relevant != "true" then true
            else del(.changes) | all(.[]; .result == "success") end' <<<"$RESULTS"
