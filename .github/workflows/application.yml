name: Application

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only pull requests and merge groups share a group. A shared group keeps one waiting
  # run and cancels the others, even without cancel-in-progress, so main pushes, manual
  # and scheduled runs each get their own.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.ref || github.run_id }}
  # A newer commit replaces a pull request's run. A cancelled merge group would eject its
  # pull requests from the queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      vulnerabilities: ${{ steps.plan.outputs.vulnerabilities }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merge group's base can be further back than its first parent.
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - id: plan
        # Pull requests and merge groups run their base's planner, so editing the planner
        # cannot select its own checks. A key the base planner does not know selects the suite.
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group) base=$MERGE_GROUP_BASE_SHA ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base:scripts/ci-plan.mjs" 2>/dev/null; then
            git show "$base:scripts/ci-plan.mjs" > "$RUNNER_TEMP/ci-plan.mjs"
            node "$RUNNER_TEMP/ci-plan.mjs"
          fi
          grep -q '^go=' "$GITHUB_OUTPUT" || echo "go=true" >> "$GITHUB_OUTPUT"

  build:
    name: Application checks and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/platform/go.mod
          cache-dependency-path: services/platform/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: ./.github/actions/install-pnpm
      - run: pnpm install --frozen-lockfile
      - run: make verify-app-build
        env:
          SOURCE_SIZE_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.merge_group.base_sha || 'HEAD^1' }}
      - run: make verify-image
        env:
          PLAT_APP_DOCKER_HOST: unix:///var/run/docker.sock
          SOURCE_REVISION: ${{ github.sha }}
      - run: pnpm app:source
        env:
          SOURCE_REVISION: ${{ github.sha }}

  go:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    name: Go race (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [remaining, operations, crosshost, preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/platform/go.mod
          cache-dependency-path: services/platform/go.sum
      - name: Pull pinned images
        uses: ./.github/actions/pull-images
        with:
          images: |
            postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
            busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
            traefik:v3.7.16@sha256:22a759fb803abb5c3a7ba5d5a55a201c5fb0fc8993d5c72c47a89075e64f1953
      - run: make verify-app-go-${{ matrix.lane }}
        env:
          PLAT_APP_DOCKER_HOST: unix:///var/run/docker.sock

  vulnerabilities:
    needs: plan
    # Empty when the base planner does not know this suite, which selects it.
    if: needs.plan.outputs.vulnerabilities != 'false'
    uses: ./.github/workflows/vulnerability-scan.yml

  verify:
    name: Application verification
    if: always()
    needs: [plan, build, go, vulnerabilities]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require checks, builds and selected lanes
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SELECTED: ${{ needs.plan.outputs.go }}
          GO_RESULT: ${{ needs.go.result }}
          SCAN_SELECTED: ${{ needs.plan.outputs.vulnerabilities }}
          SCAN_RESULT: ${{ needs.vulnerabilities.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$BUILD_RESULT" = success
          case "$SELECTED:$GO_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
          case "$SCAN_SELECTED:$SCAN_RESULT" in
            true:success|:success|false:skipped) ;;
            *) exit 1 ;;
          esac
