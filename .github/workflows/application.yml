name: Application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/platform/go.mod
          cache-dependency-path: services/platform/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Pull pinned probe image
        run: docker pull busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      - run: make verify-app-core
        env:
          PLAT_APP_DOCKER_HOST: unix:///var/run/docker.sock
          WRANGLER_SEND_METRICS: "false"
      - run: make verify-image
        env:
          PLAT_APP_DOCKER_HOST: unix:///var/run/docker.sock
          SOURCE_REVISION: ${{ github.sha }}
      - run: pnpm app:source
        env:
          SOURCE_REVISION: ${{ github.sha }}
