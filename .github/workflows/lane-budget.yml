name: Lane budget

on:
  workflow_dispatch:
  # Compares recent main runs, so runner variance cannot fail a pull request.
  schedule:
    - cron: "11 5 * * *"

permissions:
  actions: read
  contents: read
  # Opens an issue while a lane is past its budget and closes it afterwards.
  issues: write

jobs:
  budget:
    name: Compare Go race lane times
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - run: make check-lane-budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The scheduled scans cannot report their own report job failing or never starting.
      - if: always()
        run: node scripts/schedule-watch.mjs scheduled-scans.yml "Scheduled scans stopped reporting" "Report to issues"
        env:
          GITHUB_TOKEN: ${{ github.token }}
