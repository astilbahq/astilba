name: Workshop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - id: plan
        # Pull requests run the base branch's planner, so editing the planner cannot
        # select its own checks. A key the base planner does not know selects the suite.
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git cat-file -e HEAD^1:scripts/ci-plan.mjs 2>/dev/null; then
            git show HEAD^1:scripts/ci-plan.mjs > "$RUNNER_TEMP/ci-plan.mjs"
            node "$RUNNER_TEMP/ci-plan.mjs"
          fi
          grep -q '^browser=' "$GITHUB_OUTPUT" || echo "browser=true" >> "$GITHUB_OUTPUT"

  workshop:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    name: Stories (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version aligned with the dashboard @playwright/test dependency.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --shm-size=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @astilba/dashboard storybook:test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Retain workshop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workshop-${{ matrix.browser }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            .artifacts/storybook/test-results/**/trace.zip
            .artifacts/storybook/test-results/**/error-context.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Workshop verification
    if: always()
    needs: [plan, workshop]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every browser shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          SHARDS_RESULT: ${{ needs.workshop.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$SELECTED:$SHARDS_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
