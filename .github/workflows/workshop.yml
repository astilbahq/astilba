name: Workshop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workshop:
    name: Stories (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version aligned with the dashboard @playwright/test dependency.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --shm-size=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @astilba/dashboard storybook:test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

  verify:
    name: Workshop verification
    if: always()
    needs: [workshop]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every browser shard
        env:
          SHARDS_RESULT: ${{ needs.workshop.result }}
        run: test "$SHARDS_RESULT" = success
