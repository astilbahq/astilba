name: Go

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # Nightly runs must not cancel an in-flight push to the same ref.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A cancelled merge group would eject its pull requests from the queue.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  plan:
    name: Select durable-execution checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.plan.outputs.durable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merge group's base can be further back than its first parent.
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - id: plan
        # Pull requests and merge groups run their base's planner, so editing the planner
        # cannot select its own checks. A key the base planner does not know selects the suite.
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group) base=$MERGE_GROUP_BASE_SHA ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base:scripts/ci-plan.mjs" 2>/dev/null; then
            git show "$base:scripts/ci-plan.mjs" > "$RUNNER_TEMP/ci-plan.mjs"
            node "$RUNNER_TEMP/ci-plan.mjs"
          fi
          grep -q '^durable=' "$GITHUB_OUTPUT" || echo "durable=true" >> "$GITHUB_OUTPUT"

  go:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    name: Durable execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: experiments/durable-execution/go.mod
          cache-dependency-path: experiments/durable-execution/go.sum
      - name: Pull pinned fixture images
        run: |
          docker pull postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
          docker pull busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          docker pull traefik:v3.7.16@sha256:22a759fb803abb5c3a7ba5d5a55a201c5fb0fc8993d5c72c47a89075e64f1953
      - name: Verify
        run: bash experiments/durable-execution/verify.sh
        env:
          PLAT2_DOCKER_HOST: unix:///var/run/docker.sock

  verify:
    name: Go verification
    if: always()
    needs: [plan, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the selected durable-execution checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          RESULT: ${{ needs.go.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$SELECTED:$RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
