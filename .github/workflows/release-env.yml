name: Release Env

on:
  push:
    tags:
      - "env/v*"

permissions:
  contents: read

concurrency:
  group: release-env-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check tag matches main and package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "env/v$(node -p "require('./packages/env/package.json').version")"

  package-matrix:
    name: Verify complete package matrix
    needs: check-tag
    uses: ./.github/workflows/env-package-matrix.yml

  publish:
    name: Stage on npm
    needs: package-matrix
    runs-on: ubuntu-latest
    environment: npm-env
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: packages/env/.artifacts/release
      - name: Verify downloaded archive
        env:
          ASTILBA_ENV_ARTIFACT_DIR: .artifacts/release
        run: node packages/env/scripts/verify-artifact.mjs
      # The package only allows staged publishes: the version goes live once a maintainer
      # approves it on npmjs.com with 2FA (npm stage approve).
      - name: Stage with provenance
        run: |
          set -euo pipefail
          archive="$(node -p "require('./packages/env/.artifacts/release/manifest.json').archive.name")"
          npm stage publish "packages/env/.artifacts/release/$archive" --access public --provenance --ignore-scripts
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "packages/env/.artifacts/release/$ARCHIVE"
