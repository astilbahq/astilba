version: 2
# npm and Go modules get security updates only: routine bumps follow the
# upgrade-dependencies skill in .claude/skills, which makes the coupled edits Dependabot
# can't and covers every Go module and tool. A limit of 0 stops version updates; security
# updates have their own limit, and follow only the ignore rules that name `versions`, so
# the rules below use version ranges rather than update types.
# Version updates of images and actions wait a week for a bad release to be caught.
updates:
  - package-ecosystem: gomod
    directory: /services/platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  # pnpm-workspace.yaml brings the other workspace packages into this entry.
  - package-ecosystem: npm
    directory: /
    ignore:
      # @types/node's major follows the Node version pinned in package.json's engines;
      # move this range when engines moves.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # pnpm 12 ships as a wrapper with optional dependencies, which scripts/install-pnpm.mjs
      # refuses because it checks only one tarball. Moving to it means changing that script.
      - dependency-name: pnpm
        versions: [">=12"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  # Alpine is the shipped image's base, and its CA bundle is the one the image trusts. The
  # Go and Node build images stay in step with go.mod, engines and CI's pins, so they change
  # by hand. Dependabot has no Docker security updates, so Alpine fixes wait here too.
  - package-ecosystem: docker
    directory: /
    ignore:
      - dependency-name: golang
      - dependency-name: node
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /experiments/durable-execution
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
