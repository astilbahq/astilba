version: 2
# Version updates wait a week for a bad release to be caught. Security updates do not.
updates:
  - package-ecosystem: gomod
    directory: /services/platform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Majors stay out so each one gets its own review.
      platform-go:
        patterns: ["*"]
        update-types: [minor, patch]
  # pnpm-workspace.yaml brings the other workspace packages into this entry.
  - package-ecosystem: npm
    directory: /
    # Dependabot treats a package pinned at two versions as one dependency. It would move
    # the contract's TypeScript 5 to 7, which openapi-typescript can't load, so this
    # package's two pins change by hand. Security updates still apply.
    exclude-paths:
      - contracts/platform/package.json
    # @types/node's major follows the Node version pinned in package.json's engines.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # These can need an edit Dependabot won't make: the Playwright image in the workflows,
      # or the Vite+ pins and allowBuilds in pnpm-workspace.yaml. make check-ci fails until
      # they're aligned. They stay apart so the rest can land.
      needs-review:
        patterns:
          - "@pandacss/*"
          - "@playwright/test"
          - "@storybook/*"
          - i18next-cli
          - storybook
          - vite-plus
        update-types: [minor, patch]
      # Majors stay out so each one gets its own review.
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  # Alpine is the shipped image's base, and its CA bundle is the one the image trusts. The
  # Go and Node build images stay in step with go.mod, engines and CI's pins, so they change
  # by hand. Dependabot has no Docker security updates, so Alpine fixes wait here too.
  - package-ecosystem: docker
    directory: /
    ignore:
      - dependency-name: golang
      - dependency-name: node
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /experiments/durable-execution
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
