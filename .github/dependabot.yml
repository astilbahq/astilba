version: 2
# Version updates wait a week for a bad release to be caught. Security updates do not.
updates:
  - package-ecosystem: gomod
    directory: /services/platform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Majors stay out so each one gets its own review.
      platform-go:
        patterns: ["*"]
        update-types: [minor, patch]
  # pnpm-workspace.yaml brings the other workspace packages into this entry.
  - package-ecosystem: npm
    directory: /
    ignore:
      # @types/node's major follows the Node version pinned in package.json's engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # pnpm 12 ships as a wrapper with optional dependencies, which scripts/install-pnpm.mjs
      # refuses because it checks only one tarball. Moving to it means changing that script.
      - dependency-name: pnpm
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # These can need an edit Dependabot won't make: the Playwright image in the workflows,
      # the Vite+ pins and allowBuilds in pnpm-workspace.yaml, packageManager in package.json,
      # or regenerated API types.
      # make check-app fails until that's done. They stay apart so the rest can land.
      needs-review:
        patterns:
          - "@pandacss/*"
          - "@playwright/test"
          - "@storybook/*"
          - i18next-cli
          - openapi-typescript
          - pnpm
          - storybook
          - vite-plus
        update-types: [minor, patch]
      # Majors stay out so each one gets its own review.
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  # Alpine is the shipped image's base, and its CA bundle is the one the image trusts. The
  # Go and Node build images stay in step with go.mod, engines and CI's pins, so they change
  # by hand. Dependabot has no Docker security updates, so Alpine fixes wait here too.
  - package-ecosystem: docker
    directory: /
    ignore:
      - dependency-name: golang
      - dependency-name: node
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /experiments/durable-execution
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
