"openapi": "3.0.3"
"info":
  "title": "Astilba platform API"
  "version": "0.1.0"
  "license":
    "name": "AGPL-3.0-only"
    "url": "https://www.gnu.org/licenses/agpl-3.0.html"
"security":
  -
    "sessionCookie": []
  - automationBearer: []
"paths":
  /api/v1/workspaces/{workspaceId}/network:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getManagedNetwork
      responses:
        '200':
          description: Managed network desired state and member acknowledgements
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedNetwork'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: configureManagedNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigureManagedNetwork'}
      responses:
        '200':
          description: Reviewed network configuration saved for reconciliation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedNetwork'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/preview-policy:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: environmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPreviewPolicy
      responses:
        '200':
          description: Configured preview policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewPolicy'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: savePreviewPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavePreviewPolicy'}
      responses:
        '200':
          description: Owner-approved preview policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewPolicy'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/previews:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: environmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listPreviews
      responses:
        '200':
          description: Pull-request previews
          content:
            application/json:
              schema: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/PullRequestPreview'}}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/previews/{previewId}/actions:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: environmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: previewId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: actOnPreview
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewAction'}
      responses:
        '200':
          description: Current preview state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PullRequestPreview'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  "/api/v1/workspaces/{workspaceId}/onboarding": {
    "get": {
      "operationId": "getOnboarding",
      "parameters": [
        {
          "name": "workspaceId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Onboarding"
              }
            }
          }
        },
        "default": {
          "description": "Error",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Error"
              }
            }
          }
        }
      }
    }
  }
  "/api/v1/workspaces/{workspaceId}/servers/{serverId}/domain": {
    "get": {
      "operationId": "getServerDomain",
      "parameters": [
        {
          "name": "workspaceId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "serverId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ServerDomain"
              }
            }
          }
        },
        "default": {
          "description": "Error",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Error"
              }
            }
          }
        }
      }
    },
    "put": {
      "operationId": "configureServerDomain",
      "parameters": [
        {
          "name": "workspaceId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "serverId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ServerDomain"
              }
            }
          }
        },
        "default": {
          "description": "Error",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Error"
              }
            }
          }
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ConfigureServerDomain"
            }
          }
        }
      }
    }
  }
  "/api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/domain-suggestion": {
    "post": {
      "operationId": "suggestApplicationDomain",
      "parameters": [
        {
          "name": "workspaceId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "projectId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "environmentId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DomainSuggestion"
              }
            }
          }
        },
        "default": {
          "description": "Error",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Error"
              }
            }
          }
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "applicationId",
                "serverId"
              ],
              "properties": {
                "applicationId": {
                  "type": "string",
                  "format": "uuid"
                },
                "serverId": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          }
        }
      }
    }
  }
  "/api/v1/workspaces/{workspaceId}/servers/{serverId}/check-domain": {
    "post": {
      "operationId": "checkDomain",
      "parameters": [
        {
          "name": "workspaceId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "serverId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DomainCheck"
              }
            }
          }
        },
        "default": {
          "description": "Error",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Error"
              }
            }
          }
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "hostname"
              ],
              "properties": {
                "hostname": {
                  "type": "string",
                  "maxLength": 253,
                  "minLength": 3
                }
              }
            }
          }
        }
      }
    }
  }
  /api/v1/automation/context:
    get:
      operationId: getAutomationContext
      security: [{automationBearer: []}]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationContext'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/automation-credentials:
    get:
      operationId: listAutomationCredentials
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AutomationCredential'}}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: createAutomationCredential
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAutomationCredential'}
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationCredentialCreated'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/automation-credentials/{credentialId}:
    delete:
      operationId: revokeAutomationCredential
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Revoked}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/operations/{operationId}:
    get:
      operationId: getEnvironmentOperation
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/build-targets:
    get:
      operationId: listConfiguredBuildTargets
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ConfiguredBuildTarget'}}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/build-targets/{applicationId}/runs:
    post:
      operationId: runConfiguredBuild
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunConfiguredBuild'}
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/service-catalog:
    get:
      operationId: listServiceCatalog
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Curated templates; staging requires fresh resource identities and normal revision validation.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CatalogRecipe'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  "/api/v1/session":
    "get":
      "operationId": "session"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security": []
  "/api/v1/auth/login":
    "post":
      "operationId": "login"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Login"
      "security": []
  "/api/v1/auth/mfa":
    "post":
      "operationId": "verifyMFA"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Code"
      "security": []
  "/api/v1/auth/logout":
    "post":
      "operationId": "logout"
      "responses":
        "204":
          "description": "Success"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security": []
  "/api/v1/auth/reauthenticate":
    "post":
      "operationId": "reauthenticate"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "default":
          "description": "Error"
