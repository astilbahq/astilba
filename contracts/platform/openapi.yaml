          "application/json":
            "schema":
              "$ref": "#/components/schemas/NewPassword"
  "/api/v1/auth/reset/request":
    "post":
      "operationId": "requestPasswordReset"
      "responses":
        "202":
          "description": "Success"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ResetRequest"
      "security": []
  "/api/v1/auth/reset/validate":
    "post":
      "operationId": "validatePasswordReset"
      "responses":
        "204":
          "description": "The reset link is currently valid; the token remains unused."
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AuthLinkToken"
      "security": []
  "/api/v1/auth/reset/complete":
    "post":
      "operationId": "completePasswordReset"
      "responses":
