            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Reauthenticate"
  "/api/v1/auth/password":
    "post":
      "operationId": "changePassword"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
