          application/json:
            schema:
              type: object
              additionalProperties: true
  /api/v1/workspaces/{workspaceId}/export:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: exportWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchivePassword'}
