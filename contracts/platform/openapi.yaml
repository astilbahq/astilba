                "$ref": "#/components/schemas/MFAEnrollment"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/v1/auth/mfa/confirm":
    "post":
      "operationId": "confirmMFA"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RecoveryCodes"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
