        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AcceptInvitation"
      "security": []
  "/api/v1/auth/mfa/enroll":
    "post":
      "operationId": "enrollMFA"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
