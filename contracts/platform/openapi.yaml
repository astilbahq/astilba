          "application/json":
            "schema":
              "$ref": "#/components/schemas/Code"
  "/api/v1/auth/mfa/disable":
    "post":
      "operationId": "disableMFA"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/v1/auth/mfa/recovery-codes":
    "post":
      "operationId": "regenerateRecoveryCodes"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RecoveryCodes"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspace'
  "/api/v1/workspaces/{workspaceId}":
    "get":
      "operationId": "getWorkspace"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Workspace"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "workspaceId"
          "in": "path"
