            schema: {$ref: '#/components/schemas/WorkspaceImport'}
      responses:
        '201':
          description: Imported workspace awaiting local server transfer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  "/api/v1/workspaces/{workspaceId}/alerts":
    "get":
      "operationId": "listAlerts"
      "parameters":
        - name: view
          in: query
          schema: {type: string, enum: [all, attention], default: all}
        -
          "name": "workspaceId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "before"
          "in": "query"
          "schema":
            "type": "string"
            "format": "uuid"
      # Only incident state and acknowledgement filter the attention view.
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AlertInbox"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/v1/workspaces/{workspaceId}/alerts/{alertId}/acknowledge":
    "post":
      "operationId": "acknowledgeAlert"
      "parameters":
        -
          "name": "workspaceId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "alertId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "204":
          "description": "Acknowledged"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/v1/workspaces/{workspaceId}/alert-settings":
    "get":
      "operationId": "getAlertSettings"
      "parameters":
        -
          "name": "workspaceId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AlertSettings"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "put":
      "operationId": "putAlertSettings"
      "parameters":
        -
          "name": "workspaceId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/SaveAlertSettings"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AlertSettings"
        "default":
          "description": "Error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
"components":
  "securitySchemes":
    "agentBearer":
      "type": "http"
      "scheme": "bearer"
    "sessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "__Host-astilba_session"
  "schemas":
    "ServerRole":
      "type": "string"
      "enum":
        - "deployment"
        - "build"
        - "combined"
    AgentCapabilities:
      "type": "object"
      "additionalProperties": false
      "required":
        - "protocol"
        - "version"
        - "os"
        - "arch"
        - "docker"
      properties:
        "protocol":
          "type": "integer"
          "enum":
            - 1
        "version":
          "type": "string"
          "maxLength": 80
        "os":
          "type": "string"
          "maxLength": 40
        "arch":
          "type": "string"
          "enum":
            - "amd64"
            - "arm64"
        "docker":
          "type": "boolean"
        "visual":
          "type": "boolean"
        "compose":
          "type": "boolean"
        build:
          type: boolean
        backups:
          type: boolean
        upgrades:
          type: boolean
        credentialFreeVisualCancel:
          type: boolean
          description: Agent accepts visual cancellation without re-sending hydrated credentials.
    "HostPreflight":
      "type": "object"
      "additionalProperties": false
      "required":
        - "ready"
        - "osRelease"
        - "dockerVersion"
        - "freeBytes"
        - "port80Busy"
        - "port443Busy"
        - "existingContainers"
        - "notes"
      "properties":
        "ready":
          "type": "boolean"
        "osRelease":
          "type": "string"
          "maxLength": 128
        "dockerVersion":
          "type": "string"
          "maxLength": 80
        "freeBytes":
          "type": "integer"
          "format": "int64"
        "port80Busy":
          "type": "boolean"
        "port443Busy":
          "type": "boolean"
        "existingContainers":
          "type": "integer"
        "notes":
          "type": "array"
          "maxItems": 12
          "items":
            "type": "string"
            "maxLength": 256
        "composeVersion":
          "type": "string"
          "maxLength": 80
    "Server":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "name"
        - "role"
        - "status"
        - "lastSeen"
        - "capabilities"
        - "preflight"
        - "rotationRequested"
      "properties":
        transferRequired: {type: boolean}
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
          "maxLength": 80
        "role":
          "$ref": "#/components/schemas/ServerRole"
        "status":
          "type": "string"
          "enum":
            - "pending"
            - "online"
            - "offline"
            - "revoked"
        "lastSeen":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "capabilities":
          "allOf":
            -
              "$ref": "#/components/schemas/AgentCapabilities"
          "nullable": true
        "preflight":
          "allOf":
            -
              "$ref": "#/components/schemas/HostPreflight"
          "nullable": true
        "rotationRequested":
          "type": "boolean"
    "CreateServer":
      "type": "object"
      "additionalProperties": false
      "required":
        - "name"
        - "role"
      "properties":
        "name":
          "type": "string"
          "maxLength": 80
        "role":
          "$ref": "#/components/schemas/ServerRole"
    "Enrollment":
      "type": "object"
      "additionalProperties": false
      "required":
        - "server"
        - "token"
        - "expiresAt"
      "properties":
        "server":
          "$ref": "#/components/schemas/Server"
        "token":
          "type": "string"
          "maxLength": 64
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "AgentEnrollment":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverId"
        - "token"
        - "machineId"
        - "credential"
        - "capabilities"
        - "preflight"
      "properties":
        controllerGeneration: {type: integer, format: int64, minimum: 0}
        inventory: {$ref: "#/components/schemas/ControllerInventory"}
        "serverId":
          "type": "string"
          "format": "uuid"
        "token":
          "type": "string"
          "maxLength": 64
        "machineId":
          "type": "string"
          "format": "uuid"
        "credential":
          "type": "string"
          "minLength": 43
          "maxLength": 43
        "capabilities":
          "$ref": "#/components/schemas/AgentCapabilities"
        "preflight":
          "$ref": "#/components/schemas/HostPreflight"
    "AgentHeartbeat":
      "type": "object"
      "additionalProperties": false
      "required":
        - "capabilities"
        - "preflight"
      "properties":
        "capabilities":
          "$ref": "#/components/schemas/AgentCapabilities"
        "preflight":
          "$ref": "#/components/schemas/HostPreflight"
    "AgentStatus":
      "type": "object"
      "additionalProperties": false
      "required":
        - "role"
        - "rotationRequested"
      "properties":
        "role":
          "$ref": "#/components/schemas/ServerRole"
        "rotationRequested":
          "type": "boolean"
    "AgentRotation":
      "type": "object"
      "additionalProperties": false
      "required":
        - "credential"
      "properties":
        "credential":
          "type": "string"
          "minLength": 43
          "maxLength": 43
    "TestAction":
      "type": "string"
      "enum":
        - "start"
        - "inspect"
        - "remove"
    "PlanRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "serverId"
        - "environmentId"
        - "action"
      "properties":
        "serverId":
          "type": "string"
          "format": "uuid"
        "environmentId":
          "type": "string"
          "format": "uuid"
        "action":
          "$ref": "#/components/schemas/TestAction"
    "ExecutionPlan":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "serverId"
        - "environmentId"
        - "action"
        - "resourceId"
        - "image"
        - "hash"
        - "revisionId"
        - "expiresAt"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "serverId":
          "type": "string"
          "format": "uuid"
        "environmentId":
          "type": "string"
          "format": "uuid"
        "action":
          "$ref": "#/components/schemas/TestAction"
        "resourceId":
          "type": "string"
          "format": "uuid"
        "image":
          "type": "string"
          "maxLength": 256
        "hash":
          "type": "string"
          "maxLength": 64
        "revisionId":
          "type": "string"
          "format": "uuid"
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "ApplyPlan":
      "type": "object"
      "additionalProperties": false
      "required":
        - "idempotencyKey"
      "properties":
        "idempotencyKey":
          "type": "string"
          "format": "uuid"
    "AgentRelease":
      "type": "object"
      "additionalProperties": false
      "required":
        - "version"
        - "protocol"
        - "arch"
        - "size"
        - "sha256"
        - "signature"
      "properties":
        "version":
          "type": "string"
          "maxLength": 80
        "protocol":
          "type": "integer"
          "enum":
            - 1
        "arch":
          "type": "string"
          "enum":
            - "amd64"
            - "arm64"
        "size":
          "type": "integer"
          "format": "int64"
        "sha256":
          "type": "string"
          "maxLength": 64
        "signature":
          "type": "string"
          "maxLength": 128
    "UpdateAgent":
      "type": "object"
      "additionalProperties": false
      "required":
        - "version"
      "properties":
        "version":
          "type": "string"
          "maxLength": 80
    ExecutionCommand:
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "serverId"
        - "environmentId"
        - "generation"
        - "planHash"
        - "kind"
        - "action"
        - "resourceId"
        - "image"
        - "deadline"
        - "release"
        - "cancelRequested"
      properties:
        controllerGeneration: {type: integer, format: int64, minimum: 0}
        "id":
          "type": "string"
          "format": "uuid"
        "serverId":
          "type": "string"
          "format": "uuid"
        "environmentId":
          "type": "string"
          "format": "uuid"
        "generation":
          "type": "integer"
          "format": "int64"
        "planHash":
          "type": "string"
          "maxLength": 64
        kind:
          type: string
          enum:
            - test
            - update
            - visual
            - pipeline
            - backup
            - upgrade
        "action":
          "$ref": "#/components/schemas/TestAction"
        "resourceId":
          "type": "string"
          "format": "uuid"
        "image":
          "type": "string"
          "maxLength": 256
        "deadline":
          "type": "string"
          "format": "date-time"
        "release":
          "allOf":
            -
              "$ref": "#/components/schemas/AgentRelease"
          "nullable": true
        "cancelRequested":
          "type": "boolean"
        "visual":
          "$ref": "#/components/schemas/VisualPayload"
        pipeline:
          $ref: '#/components/schemas/PipelineCommand'
        backup:
          $ref: '#/components/schemas/BackupCommand'
        upgrade:
          $ref: '#/components/schemas/UpgradeCommand'
    "ExecutionState":
      "type": "string"
      "enum":
        - "queued"
        - "dispatched"
        - "running"
        - "waiting_for_agent"
        - "needs_attention"
        - "succeeded"
        - "failed"
        - "cancelled"
    "ExecutionStep":
      "type": "object"
      "additionalProperties": false
      "required":
        - "name"
        - "state"
        - "detail"
      "properties":
        "name":
          "type": "string"
          "maxLength": 80
        "state":
          "type": "string"
          "enum":
            - "intent"
            - "done"
        "detail":
          "type": "string"
          "maxLength": 256
    AgentReport:
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "generation"
        - "planHash"
        - "sequence"
        - "state"
        - "steps"
        - "note"
      properties:
        "id":
          "type": "string"
          "format": "uuid"
        "generation":
          "type": "integer"
          "format": "int64"
        "planHash":
          "type": "string"
          "maxLength": 64
        "sequence":
          "type": "integer"
          "format": "int64"
        "state":
          "$ref": "#/components/schemas/ExecutionState"
        "steps":
          "type": "array"
          "maxItems": 16
          "items":
            "$ref": "#/components/schemas/ExecutionStep"
        "note":
          "type": "string"
          "maxLength": 1024
        "observation":
          "$ref": "#/components/schemas/VisualObservation"
        pipeline:
          $ref: '#/components/schemas/PipelineResult'
        upgrade:
          $ref: '#/components/schemas/UpgradeStatus'
    Operation:
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "serverId"
        - "environmentId"
        - "generation"
        - "state"
        - "kind"
        - "cancelRequested"
        - "note"
        - "steps"
        - "createdAt"
      properties:
        "id":
          "type": "string"
          "format": "uuid"
        "serverId":
          "type": "string"
          "format": "uuid"
        "environmentId":
          "type": "string"
          "format": "uuid"
        "generation":
          "type": "integer"
          "format": "int64"
        "state":
          "$ref": "#/components/schemas/ExecutionState"
        kind:
          type: string
          enum:
            - test
            - update
            - visual
            - pipeline
            - backup
            - upgrade
        "cancelRequested":
          "type": "boolean"
        "note":
          "type": "string"
          "maxLength": 1024
        "steps":
          "type": "array"
          "maxItems": 16
          "items":
            "$ref": "#/components/schemas/ExecutionStep"
        "createdAt":
          "type": "string"
          "format": "date-time"
    "AgentPoll":
      "type": "object"
      "additionalProperties": false
      "required":
        - "command"
      "properties":
        "command":
          "allOf":
            -
              "$ref": "#/components/schemas/ExecutionCommand"
          "nullable": true
    "Error":
      "type": "object"
      "additionalProperties": false
      "properties":
        "code":
          "type": "string"
          "maxLength": 80
        "message":
          "type": "string"
          "maxLength": 240
        "requestId":
          "type": "string"
          "maxLength": 80
        "fields":
          "type": "array"
          "items":
            "type": "string"
            "maxLength": 160
        "currentRevision":
          "$ref": "#/components/schemas/Revision"
      "required":
        - "code"
        - "message"
        - "requestId"
    "Role":
      "type": "string"
      "enum":
        - "owner"
        - "operator"
        - "viewer"
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 254
          format: email
        name:
          type: string
          maxLength: 80
          minLength: 1
        mfaEnabled:
          type: boolean
        recoveryCodesRemaining:
          type: integer
        emailVerified:
          type: boolean
      required:
        - id
        - email
        - name
        - mfaEnabled
        - recoveryCodesRemaining
        - emailVerified
    "Workspace":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
          "maxLength": 80
          "minLength": 1
        "role":
          "$ref": "#/components/schemas/Role"
        "requireMfa":
          "type": "boolean"
      "required":
        - "id"
        - "name"
        - "role"
        - "requireMfa"
    "Session":
      "type": "object"
