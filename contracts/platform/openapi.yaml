                $ref: "#/components/schemas/Error"
  "/api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/releases":
    get:
      operationId: listReleases
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Recent successfully applied plans; image availability is checked when preparing rollback.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: {$ref: '#/components/schemas/ReleaseHistoryEntry'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  "/api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/releases/{planId}/rollback":
    post:
      operationId: rollbackRelease
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: planId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRelease'}
      responses:
        '201':
          description: A new draft revision; nothing is deployed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
"components":
  "securitySchemes":
    automationBearer: {type: http, scheme: bearer}
    "agentBearer":
      "type": "http"
      "scheme": "bearer"
    "sessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "__Host-astilba_session"
  "schemas":
    CrossHostInventory:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, unboundedInventoryHash]
      properties:
        ingressReady: {type: boolean}
        cpuMillis: {type: integer, minimum: 1}
        memoryMiB: {type: integer, minimum: 1}
        unboundedInventoryHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ManagedNetworkMemberInput:
      type: object
      additionalProperties: false
      required: [serverId, endpoint, listenPort, cpuMillis, memoryMiB, unboundedInventoryHash]
      properties:
        serverId: {type: string, format: uuid}
        endpoint: {type: string, maxLength: 128}
        listenPort: {type: integer, minimum: 1024, maximum: 65535}
        cpuMillis: {type: integer, minimum: 100, maximum: 256000}
        memoryMiB: {type: integer, minimum: 64, maximum: 1048576}
        unboundedInventoryHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ConfigureManagedNetwork:
      type: object
      additionalProperties: false
      required: [baseGeneration, prefix, members]
      properties:
        baseGeneration: {type: integer, format: int64, minimum: 0}
        prefix: {type: string, maxLength: 32}
        members:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/ManagedNetworkMemberInput'}
    ManagedNetwork:
      type: object
      x-go-type: json.RawMessage
      additionalProperties: false
      required: [id, generation, prefix, state, members]
      properties:
        id: {type: string, format: uuid}
        generation: {type: integer, format: int64}
        prefix: {type: string}
        state: {type: string}
        members:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [serverId, membershipId, address, endpoint, listenPort, cpuMillis, memoryMiB, unboundedInventoryHash, enabled, generation, acknowledgedGeneration, state, note]
            properties:
              serverId: {type: string, format: uuid}
              membershipId: {type: string, format: uuid}
              address: {type: string}
              endpoint: {type: string}
              listenPort: {type: integer}
              cpuMillis: {type: integer}
              memoryMiB: {type: integer}
              unboundedInventoryHash: {type: string}
              publicKey: {type: string}
              enabled: {type: boolean}
              generation: {type: integer, format: int64}
              acknowledgedGeneration: {type: integer, format: int64}
              state: {type: string}
              note: {type: string}
    CrossHostPlacement:
      type: object
      additionalProperties: false
      required: [networkId, ingressServerId, applications]
      properties:
        networkId: {type: string, format: uuid}
        ingressServerId: {type: string, format: uuid}
        applications:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [applicationId, cpuMillis, memoryMiB, targets]
            properties:
              applicationId: {type: string, format: uuid}
              cpuMillis: {type: integer, minimum: 100, maximum: 16000}
              memoryMiB: {type: integer, minimum: 64, maximum: 65536}
              targets:
                type: array
                minItems: 1
                maxItems: 4
                items:
                  type: object
                  additionalProperties: false
                  required: [serverId, count]
                  properties:
                    serverId: {type: string, format: uuid}
                    count: {type: integer, minimum: 1, maximum: 10}
    NetworkCommand:
      type: object
      x-go-type: json.RawMessage
      additionalProperties: true
    NetworkReceipt:
      type: object
      x-go-type: json.RawMessage
      additionalProperties: true
    CrossHostCommand:
      type: object
      x-go-type: json.RawMessage
      additionalProperties: true
    RecoveryDescriptor:
      type: object
      x-go-type: json.RawMessage
      additionalProperties: false
      required: [version,workspaceId,parentId,rootHash,groupId,groupHash,baseId,checkpointId,sequence,digest,bytes,participants]
      properties:
        version: {type: integer,enum: [1]}
        workspaceId: {type: string,format: uuid}
        parentId: {type: string,format: uuid}
        rootHash: {type: string,pattern: '^[a-f0-9]{64}$'}
        groupId: {type: string,format: uuid}
        groupHash: {type: string,pattern: '^[a-f0-9]{64}$'}
        baseId: {type: string,format: uuid}
        checkpointId: {type: string,format: uuid}
        sequence: {type: integer,format: int64,minimum: 0}
        previousHash: {type: string,pattern: '^[a-f0-9]{64}$'}
        digest: {type: string,pattern: '^[a-f0-9]{64}$'}
        bytes: {type: integer,minimum: 1,maximum: 1048576}
        participants:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: {type: string,format: uuid}
    CrossHostReceipt:
      type: object
      x-go-type: json.RawMessage
      additionalProperties: true
    PreviewCleanupReceipt:
      type: object
      additionalProperties: false
      required: [operationId, digest]
      properties:
        operationId: {type: string, format: uuid}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    PreviewLimits:
      type: object
      additionalProperties: false
      required: [cpus, memoryMiB, pids]
      properties:
        cpus: {type: integer, minimum: 1, maximum: 4}
        memoryMiB: {type: integer, minimum: 128, maximum: 8192}
        pids: {type: integer, minimum: 32, maximum: 512}
    PreviewPolicyConfiguration:
      type: object
      additionalProperties: false
      required: [baseRevisionId, applicationId, build, maxActive, maxConcurrentBuilds, limits, closeGraceHours, generatedDomains]
      properties:
        baseRevisionId: {type: string, format: uuid}
        applicationId: {type: string, format: uuid}
        build: {$ref: '#/components/schemas/BuildConfiguration'}
        maxActive: {type: integer, minimum: 1, maximum: 10}
        maxConcurrentBuilds: {type: integer, minimum: 1, maximum: 3}
        limits: {$ref: '#/components/schemas/PreviewLimits'}
        closeGraceHours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 168
          description: Null retains closed previews until owner cleanup. Zero deletes immediately.
        generatedDomains: {type: boolean}
    PreviewPolicy:
      type: object
      additionalProperties: false
      required: [id, enabled, generation, configuration]
      properties:
        note: {type: string}

        id: {type: string, format: uuid}
        enabled: {type: boolean}
        generation: {type: integer, format: int64}
        configuration: {$ref: '#/components/schemas/PreviewPolicyConfiguration'}
    SavePreviewPolicy:
      type: object
      additionalProperties: false
      required: [enabled, generation, configuration]
      properties:
        enabled: {type: boolean}
        generation: {type: integer, format: int64, minimum: 0}
        configuration: {$ref: '#/components/schemas/PreviewPolicyConfiguration'}
    PullRequestPreview:
      type: object
      additionalProperties: false
      required: [id, number, head, headRepository, fork, state, note, generation]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer}
        head: {type: string}
        headRepository: {type: integer, format: int64}
        fork: {type: boolean}
        state: {type: string}
        note: {type: string}
        generation: {type: integer, format: int64}
        environmentId: {type: string, format: uuid}
        operationId: {type: string, format: uuid}
        cleanupAt: {type: string, format: date-time}
    PreviewAction:
      type: object
      additionalProperties: false
      required: [action, head, headRepository]
      properties:
        action: {type: string, enum: [refresh, approve, cleanup]}
        head: {type: string, maxLength: 64}
        headRepository: {type: integer, format: int64}
    "Onboarding": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "keyFingerprint",
        "applicationDomain",
        "automaticDNS",
        "bootstrapURL"
      ],
      "properties": {
        "keyFingerprint": {
          "type": "string"
        },
        "applicationDomain": {
          "type": "string"
        },
        "automaticDNS": {
          "type": "boolean"
        },
        "bootstrapURL": {
          "type": "string"
        }
      }
    }
    "ConfigureServerDomain": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "baseGeneration",
        "ipv4",
        "ipv6"
      ],
      "properties": {
        "baseGeneration": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "ipv4": {
          "type": "string",
          "maxLength": 45
        },
        "ipv6": {
          "type": "string",
          "maxLength": 45
        }
      }
    }
    "ServerDomain": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "serverId",
        "base",
        "wildcard",
        "ipv4",
        "ipv6",
        "generation",
        "state",
        "observedAt",
        "note",
        "automaticDNS"
      ],
      "properties": {
        "serverId": {
          "type": "string",
          "format": "uuid"
        },
        "base": {
          "type": "string"
        },
        "wildcard": {
          "type": "string"
        },
        "ipv4": {
          "type": "string"
        },
        "ipv6": {
          "type": "string"
        },
        "generation": {
          "type": "integer",
          "format": "int64"
        },
        "state": {
          "type": "string",
          "enum": [
            "unconfigured",
            "pending",
            "applied",
            "manual",
            "failed",
            "review_required",
            "disabled"
          ]
        },
        "observedAt": {
          "type": "string",
          "format": "date-time",
          "nullable": true
        },
        "note": {
          "type": "string"
        },
        "automaticDNS": {
          "type": "boolean"
        }
      }
    }
    "DomainSuggestion": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "hostname",
        "serverId",
        "dns"
      ],
      "properties": {
        "hostname": {
          "type": "string"
        },
        "serverId": {
          "type": "string",
          "format": "uuid"
        },
        "dns": {
          "$ref": "#/components/schemas/ServerDomain"
        }
      }
    }
    "DomainCheck": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "hostname",
        "state",
        "addresses",
        "checkedAt",
        "note"
      ],
      "properties": {
        "hostname": {
          "type": "string"
        },
        "state": {
          "type": "string",
          "enum": [
            "matches",
            "unverified",
            "unavailable"
          ]
        },
        "addresses": {
          "type": "array",
          "maxItems": 100,
          "items": {
            "type": "string"
          }
        },
        "checkedAt": {
          "type": "string",
          "format": "date-time"
        },
        "note": {
          "type": "string"
        }
      }
    }
    AutomationCapability:
      type: string
      enum: ['environment:read', 'configuration:write', 'deployment:plan', 'deployment:apply', 'build:run']
    AutomationCredential:
      type: object
      additionalProperties: false
      required: [id, creatorId, name, capabilities, createdAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        creatorId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        capabilities: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/AutomationCapability'}}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time, nullable: true}
    CreateAutomationCredential:
      type: object
      additionalProperties: false
      required: [name, capabilities, expiresAt]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        capabilities: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/AutomationCapability'}}
        expiresAt: {type: string, format: date-time}
    AutomationCredentialCreated:
      type: object
      additionalProperties: false
      required: [credential, token]
      properties:
        credential: {$ref: '#/components/schemas/AutomationCredential'}
        token: {type: string, writeOnly: true, description: Returned once. Store privately; never log it.}
    AutomationContext:
      type: object
      additionalProperties: false
      required: [credentialId, workspaceId, projectId, environmentId, workspace, project, environment, capabilities, expiresAt]
      properties:
        credentialId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        workspace: {type: string}
        project: {type: string}
        environment: {type: string}
