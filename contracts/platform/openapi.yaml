    AgentCapabilities:
      "type": "object"
      "additionalProperties": false
      "required":
        - "protocol"
        - "version"
        - "os"
        - "arch"
        - "docker"
      properties:
        crossHost: {type: boolean, description: Supports versioned managed private links and coordinated cross-host commands.}
        maintenanceContinuation: {type: boolean, description: Supports stateful maintenance writer resumption after its admission deadline with primary-first delivery.}
        previews:
          type: boolean
          description: Supports bounded preview plans and ownership-verified cleanup.

        "protocol":
          "type": "integer"
          "enum":
            - 1
        "version":
          "type": "string"
          "maxLength": 80
        "os":
          "type": "string"
          "maxLength": 40
        "arch":
          "type": "string"
          "enum":
            - "amd64"
            - "arm64"
        "docker":
          "type": "boolean"
        "visual":
          "type": "boolean"
        "compose":
          "type": "boolean"
        serviceOutputs:
          type: boolean
          description: Supports named service output references; advertised only after Astilba-Agent-Service-Outputs v1.
        safeReleases:
          type: boolean
          description: Supports instance-based stateless HTTP releases. Advertised only after Astilba-Agent-Safe-Releases v1.
        replicas:
          type: boolean
          description: Supports replica recipe 3 and complete instance groups. Advertised only after Astilba-Agent-Replicas v1.
        buildControls:
          type: boolean
          description: Supports explicit build budgets and frozen-commit watch paths. Agents send this extension only after a controller response advertises Astilba-Agent-Features with build-controls.
        buildCache:
          type: boolean
          description: Supports bounded project-scoped layer caches. Agents send this extension only after a controller response advertises Astilba-Agent-Build-Cache with v1.
        railpackVersion:
          type: string
          maxLength: 80
          description: Supported Railpack planner/frontend version. Agents send this extension only after a controller response advertises Astilba-Agent-Railpack with v1.
        build:
          type: boolean
        schedules:
          type: boolean
          description: Supports general schedule formats and bounded job cleanup. Advertised only after Astilba-Agent-Schedules v1.
        backups:
          type: boolean
        upgrades:
          type: boolean
        credentialFreeVisualCancel:
          type: boolean
          description: Agent accepts visual cancellation without re-sending hydrated credentials.
