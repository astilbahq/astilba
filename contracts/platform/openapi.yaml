          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/workspaces/{workspaceId}/subscription/portal:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: billingPortal
      responses:
        '200':
          description: Success
