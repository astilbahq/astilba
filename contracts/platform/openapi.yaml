            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/workspaces/{workspaceId}/servers/{serverId}/transfer:
    parameters:
      - {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: serverId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: prepareServerTransfer
      responses:
        '201':
          description: Local owner transfer ticket
          content:
            application/json:
