name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-packages:
    name: Verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Confirm release commit is on main
        run: |
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "The release commit must be part of the main branch." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm verify:release-version

      - name: Install browser
        run: pnpm test:browser:install:ci

      - name: Verify repository
        run: pnpm verify

      - name: Pack release artifacts
        run: |
          artifact_directory="$RUNNER_TEMP/release-artifact"
          mkdir -p "$artifact_directory"
          pnpm --filter @astilba/tokens pack --pack-destination "$artifact_directory"
          pnpm --filter @astilba/ui pack --pack-destination "$artifact_directory"

          mapfile -t tarballs < <(find "$artifact_directory" -maxdepth 1 -type f -name 'astilba-*.tgz' | sort)
          if [[ "${#tarballs[@]}" -ne 2 ]]; then
            echo "Expected exactly two Astilba package tarballs." >&2
            exit 1
          fi

          (
            cd "$artifact_directory"
            sha256sum "$(basename "${tarballs[0]}")" "$(basename "${tarballs[1]}")" > SHA256SUMS
          )

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: astilba-ui-release
          path: |
            ${{ runner.temp }}/release-artifact/astilba-*.tgz
            ${{ runner.temp }}/release-artifact/SHA256SUMS
          retention-days: 1

  publish:
    name: Publish npm packages
    needs: verify-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing and provenance.
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astilba-ui-release
          path: ${{ runner.temp }}/release-artifact

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release artifact checksums
        run: sha256sum --check SHA256SUMS
        working-directory: ${{ runner.temp }}/release-artifact

      - name: Publish verified artifacts
        run: |
          artifact_directory="$RUNNER_TEMP/release-artifact"
          mapfile -t tokens_tarballs < <(find "$artifact_directory" -maxdepth 1 -type f -name 'astilba-tokens-*.tgz')
          mapfile -t ui_tarballs < <(find "$artifact_directory" -maxdepth 1 -type f -name 'astilba-ui-*.tgz')

          if [[ "${#tokens_tarballs[@]}" -ne 1 || "${#ui_tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one tarball for each release package." >&2
            exit 1
          fi

          npm publish "${tokens_tarballs[0]}" --access public --provenance
          npm publish "${ui_tarballs[0]}" --access public --provenance
