name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - label: minimum
            version: "22.18.0"
          - label: current
            version: "24.18.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: ${{ matrix.node.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:base

  browser:
    name: Browser contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      showcase_artifact_digest: ${{ steps.upload_showcase.outputs.artifact-digest }}
      showcase_artifact_id: ${{ steps.upload_showcase.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: "24.18.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm test:browser:install:ci

      - name: Test browser contract
        run: pnpm test:browser

      - name: Validate showcase deployment
        run: pnpm deploy:dry-run

      - name: Upload verified showcase artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: upload_showcase
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcase-production-dist-${{ github.sha }}
          path: apps/showcase/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy showcase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ui.astilba.com/
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified showcase artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.browser.outputs.showcase_artifact_id }}
          path: apps/showcase/dist
          digest-mismatch: error

      - name: Confirm artifact provenance
        env:
          SHOWCASE_ARTIFACT_DIGEST: ${{ needs.browser.outputs.showcase_artifact_digest }}
        run: |
          if [[ ! "$SHOWCASE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The verified showcase artifact is missing its SHA-256 digest."
            exit 1
          fi

          if [[ ! -f apps/showcase/dist/index.html || ! -f apps/showcase/dist/_headers || ! -f apps/showcase/dist/robots.txt ]]; then
            echo "::error::The verified showcase artifact is incomplete."
            exit 1
          fi

          mapfile -t scripts < <(find apps/showcase/dist/assets -maxdepth 1 -type f -name '*.js')
          mapfile -t styles < <(find apps/showcase/dist/assets -maxdepth 1 -type f -name '*.css')
          if [[ "${#scripts[@]}" -lt 1 || "${#styles[@]}" -lt 1 ]]; then
            echo "::error::The verified showcase artifact is missing compiled assets."
            exit 1
          fi

          echo "Deploying verified showcase artifact sha256:$SHOWCASE_ARTIFACT_DIGEST"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reject a stale main revision
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          read -r current_main_sha current_main_ref < <(
            git ls-remote --exit-code origin refs/heads/main
          )

          if [[ "$current_main_ref" != "refs/heads/main" || "$current_main_sha" != "$VERIFIED_SHA" ]]; then
            echo "::error::Refusing to deploy $VERIFIED_SHA because origin/main is $current_main_sha."
            exit 1
          fi

      - name: Deploy verified showcase
        run: pnpm deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke-test showcase
        run: pnpm smoke:production
