# INERT: separate protected activation and provisioning are required.
name: Public web recovery (inactive preparation)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Approved current main SHA (40 lowercase hex characters)
        required: true
        type: string
      scope:
        description: Include every possibly attempted app, even failed or timed-out writes
        required: true
        type: choice
        options: [site, docs-site, all]
      incident:
        description: Non-confidential incident identifier or short reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

env:
  RECOVERY_ENABLED: ${{ vars.WEB_RECOVERY_ENABLED }}
  EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
  RECOVERY_SCOPE: ${{ inputs.scope }}
  RECOVERY_INCIDENT: ${{ inputs.incident }}

jobs:
  plan:
    if: github.repository == 'astilbahq/astilba' && github.ref == 'refs/heads/main' && vars.WEB_RECOVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      label: ${{ steps.plan.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind approval to incident, scope, main and allowlisted capsule
        id: plan
        run: python3 tooling/deployment/recovery/recover.py plan

  recover:
    name: Recover ${{ needs.plan.outputs.label }}
    needs: plan
    if: github.repository == 'astilbahq/astilba' && github.ref == 'refs/heads/main' && vars.WEB_RECOVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    environment:
      name: production-web
      url: https://astilba.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Define isolated recovery paths
        run: |
          {
            echo "RECOVERY_DIRECTORY=$RUNNER_TEMP/verified-recovery"
            echo "RECOVERY_JOURNAL=$RUNNER_TEMP/recovery-journal.jsonl"
            echo "CAPSULE_PATH=$RUNNER_TEMP/recovery-capsule.tar.gz"
            echo "RUNTIME_PATH=$RUNNER_TEMP/recovery-runtime.tar.gz"
          } >> "$GITHUB_ENV"
      - name: Recheck protected environment, immutable identity and current main
        id: preflight
        run: python3 tooling/deployment/recovery/recover.py preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_S3_BUCKET: ${{ vars.RECOVERY_S3_BUCKET }}
          RECOVERY_AWS_REGION: ${{ vars.RECOVERY_AWS_REGION }}
          RECOVERY_READER_ROLE_ARN: ${{ vars.RECOVERY_READER_ROLE_ARN }}
          RECOVERY_CAPSULE_KEY: ${{ vars.RECOVERY_CAPSULE_KEY }}
          RECOVERY_CAPSULE_VERSION: ${{ vars.RECOVERY_CAPSULE_VERSION }}
          RECOVERY_RUNTIME_KEY: ${{ vars.RECOVERY_RUNTIME_KEY }}
          RECOVERY_RUNTIME_VERSION: ${{ vars.RECOVERY_RUNTIME_VERSION }}
      - name: Assume exact-version backup read role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ steps.preflight.outputs.aws_region }}
          role-to-assume: ${{ steps.preflight.outputs.reader_role_arn }}
          role-session-name: recovery-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Read pinned object versions without registry fallback
        env:
          BACKUP_BUCKET: ${{ steps.preflight.outputs.s3_bucket }}
          CAPSULE_KEY: ${{ steps.preflight.outputs.capsule_key }}
          CAPSULE_VERSION: ${{ steps.preflight.outputs.capsule_version }}
          RUNTIME_KEY: ${{ steps.preflight.outputs.runtime_key }}
          RUNTIME_VERSION: ${{ steps.preflight.outputs.runtime_version }}
        run: |
          aws s3api get-object --bucket "$BACKUP_BUCKET" --key "$CAPSULE_KEY" --version-id "$CAPSULE_VERSION" "$CAPSULE_PATH" --no-cli-pager > /dev/null
          aws s3api get-object --bucket "$BACKUP_BUCKET" --key "$RUNTIME_KEY" --version-id "$RUNTIME_VERSION" "$RUNTIME_PATH" --no-cli-pager > /dev/null
      - name: Verify complete capsule and offline tool image before credentials
        run: python3 tooling/deployment/recovery/recover.py verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore only approved apps with scoped credentials
        run: python3 tooling/deployment/recovery/recover.py apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Stop only containers owned by this run attempt
        if: always()
        run: python3 tooling/deployment/recovery/recover.py cleanup
      - name: Preserve indeterminate writes in the job summary
        if: always()
        run: python3 tooling/deployment/recovery/recover.py summary
      - name: Retain credential-free recovery journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-journal.jsonl
          if-no-files-found: ignore
          retention-days: 90
