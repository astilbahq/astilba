name: Package matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    name: Pack exact archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: examples
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm verify
      - run: pnpm pack:artifact
      - run: pnpm verify:artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astilba-env-archive
          path: .artifacts/local
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  consumers:
    name: Clean ${{ matrix.manager }} consumer
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: .artifacts/local
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-consumer.mjs ${{ matrix.manager }}

  cloudflare-workers:
    name: Cloudflare Workers archive admission
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: .artifacts/local
      - run: node scripts/verify-workers-consumer.mjs

  node-typescript:
    name: Node ${{ matrix.node }} / TypeScript ${{ matrix.typescript }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [22.14.0, 22.23.2, 24.18.1, 26.5.1]
        typescript: [6.0.3, 7.0.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: .artifacts/local
      - run: node scripts/verify-node-consumer.mjs ${{ matrix.node }} ${{ matrix.typescript }}

  portable:
    name: Bun and workerd portable equivalence
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: .artifacts/local
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-consumer.mjs bun
      - run: node scripts/verify-portable-equivalence.mjs

  generation-and-vite:
    name: Deterministic generation and Vite
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: .artifacts/local
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-deterministic-generation.mjs
      - run: node scripts/verify-vite-consumer.mjs

  next:
    name: Next ${{ matrix.next }} / ${{ matrix.mode }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        next: [15.5.22, 16.2.12]
        mode: [app-static, app-request, pages-static, pages-request]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: .artifacts/local
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-next-consumer.mjs ${{ matrix.next }} ${{ matrix.mode }}

  windows-consumer:
    name: Windows archive consumer
    needs: pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astilba-env-archive
          path: .artifacts/local
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-consumer.mjs npm
