name: Bug report
description: Report reproducible public behavior that differs from the documentation.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private configuration values, or vulnerability details."
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
