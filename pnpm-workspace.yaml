packages:
  - packages/cache
  - packages/cache-harness
  - packages/env
  - packages/tokens
  - packages/ui
  - apps/cache-demo
  - apps/docs
  - apps/site
  - apps/ui-showcase
  - fixtures/cache-react-router
  - fixtures/ui-astro
linkWorkspacePackages: false
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAge: 4320
# Refuse versions published with weaker provenance than earlier releases,
# and transitive dependencies from git repositories or tarball URLs.
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Published by their own maintainers without provenance after earlier releases had it.
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1"
engineStrict: true
# One version per shared dependency; packages reference it as "catalog:".
# oxlint, oxfmt and oxlint-tsgolint match the versions vite-plus pins.
# packages/env keeps exact versions: its release check requires the packed package.json to
# match the source byte for byte, and pnpm pack rewrites "catalog:".
catalog:
  "@arethetypeswrong/cli": 0.18.5
  "@astrojs/check": 0.9.10
  "@astrojs/react": 6.0.6
  "@axe-core/playwright": 4.13.0
  "@cloudflare/vite-plugin": 1.64.0
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/jetbrains-mono": 5.3.0
  "@pandacss/dev": 1.12.1
  "@pandacss/preset-base": 1.12.1
  "@playwright/test": 1.64.1
  "@react-router/dev": 8.4.0
  "@testing-library/react": 16.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-istanbul": 5.0.4
  "astro": 7.3.8
  "axe-core": 4.14.0
  "cross-env": 10.1.0
  "fast-check": 4.10.2
  "isbot": 5.2.2
  "jsdom": 29.1.1
  "knip": 6.41.0
  "lucide-react": 1.57.0
  "oxfmt": 0.73.0
  "oxlint": 1.88.0
  "oxlint-tsgolint": 7.0.2004
  "postcss": 8.5.30
  "publint": 0.3.25
  "react": 19.3.0
  "react-dom": 19.3.0
  "react-router": 8.4.0
  "typescript": 6.0.3
  "ultracite": 8.0.1
  "vite": 8.3.4
  "vite-plus": 1.2.0
  "vitest": 5.0.4
  "wrangler": 4.151.0
overrides:
  "@expressive-code/core@0.44.2>postcss-nested": 7.0.2
  # unifont 0.7.5 requires Node 22.19 through Undici 8.
  unifont@0.7.5: 0.7.4
  postcss@>=8.0.0 <8.5.28: 8.5.28
  tinypool@>=2.0.0 <2.1.2: 2.1.2
  browserslist@>=4.0.0 <4.28.7: 4.28.7
  postcss-selector-parser@>=7.0.0 <7.1.6: 7.1.6
  "typed-rest-client>qs": 6.16.0
