packages:
  - packages/cache
  - packages/cache-harness
  - packages/env
  - packages/tokens
  - packages/ui
  - apps/cache-demo
  - apps/docs
  - apps/site
  - apps/ui-showcase
  - fixtures/cache-react-router
  - fixtures/ui-astro
linkWorkspacePackages: false
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAge: 4320
# Refuse versions published with weaker provenance than earlier releases,
# and transitive dependencies from git repositories or tarball URLs.
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Published by their own maintainers without provenance after earlier releases had it.
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1"
engineStrict: true
