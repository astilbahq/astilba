packages:
  - apps/platform
  - apps/control-plane-worker
  - contracts/platform
  - experiments/cloudflare-hosting
  - experiments/canvas-editor
minimumReleaseAge: 1440
saveExact: true
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5
  # Miniflare pins vulnerable undici; remove when its upstream pin is patched.
  undici@7.29.1: 7.30.1
allowBuilds:
  '@parcel/watcher@2.5.6': false
  esbuild@0.28.2: true
  workerd@1.20261019.1: true
# The core alias reports the Vite+ version while bundling Vite 8.3.5.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0
