packages:
  - apps/platform
  - contracts/platform
  - experiments/canvas-editor
minimumReleaseAge: 1440
saveExact: true
overrides:
  # Keep these paired until upstream tooling adopts the patched matcher APIs.
  glob@13.0.6: 14.0.3
  minimatch@10.2.6: 11.0.3
  # @redocly/openapi-core only calls the removed default export when fetching remote
  # refs with configured headers; platform generation reads a local contract without them.
  minimatch@5.1.9: 11.0.3
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5
allowBuilds:
  '@parcel/watcher@2.5.6': false
  # i18next-cli uses the pinned platform binary; no postinstall fallback download.
  '@swc/core@1.16.20': false
  esbuild@0.28.2: true
# The core alias reports the Vite+ version while bundling Vite 8.3.5.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0
    # Storybook's Vite+ peer range stops at 0.2; the workshop suite checks each release with this Vite+.
    'storybook@10>vite-plus': 1.4.0
